# Disposable alternate ports for isolated backup-restore verification.
services:
  postgres:
    ports:
      - "127.0.0.1:55433:5432"

  qdrant:
    ports:
      - "127.0.0.1:6434:6333"

  api:
    environment:
      APP_ENV: development
      APP_PUBLIC_URL: http://localhost:3001
      WEB_AUTH_MODE: disabled
      APP_SESSION_SECRET: local-development-session-secret
      STORAGE_BACKEND: local
      RAG_BACKEND: qdrant
    ports:
      - "127.0.0.1:8001:8000"

  web:
    build:
      args:
        NEXT_PUBLIC_LOCAL_AUTH: "true"
    ports:
      - "127.0.0.1:3001:3000"

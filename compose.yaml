name: raise-local-rc

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:33198da2828a14c30348d2ccb4750833d5ed9a44c88d840a0e523d7417120337
    mem_limit: 2g
    cpus: 2.0
    environment:
      POSTGRES_DB: raise
      POSTGRES_USER: raise
      POSTGRES_PASSWORD: ${RAISE_LOCAL_DB_PASSWORD:-raise-local-only}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - raise-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raise -d raise"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.17.1@sha256:94728574965d17c6485dd361aa3c0818b325b9016dac5ea6afec7b4b2700865f
    mem_limit: 4g
    cpus: 4.0
    ports:
      - "127.0.0.1:6433:6333"
    volumes:
      - raise-qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    mem_limit: 5g
    cpus: 4.0
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      APP_PUBLIC_URL: http://localhost:3000
      DATABASE_URL: postgresql://raise:${RAISE_LOCAL_DB_PASSWORD:-raise-local-only}@postgres:5432/raise
      CLARIFICATION_DATABASE_URL: postgresql://raise:${RAISE_LOCAL_DB_PASSWORD:-raise-local-only}@postgres:5432/raise
      WEB_AUTH_MODE: disabled
      AUTH_MODE: disabled
      WEB_ALLOWED_ORIGINS: http://localhost:3000
      LOCAL_FILE_ROOT: /app/data/pilot_files
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      RAG_BACKEND: ${RAG_BACKEND:-qdrant}
      RAG_LOCAL_EMBEDDING_MODEL: ${RAG_LOCAL_EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      RAG_LOCAL_EMBEDDING_DIMENSIONS: ${RAG_LOCAL_EMBEDDING_DIMENSIONS:-384}
      ENABLE_TRUSTED_WEB_SEARCH: ${ENABLE_TRUSTED_WEB_SEARCH:-false}
      WHATSAPP_ENABLED: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - raise-private-files:/app/data
      - raise-model-cache:/app/model-cache
      - ./reports/generated:/app/reports/generated
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_LOCAL_AUTH: "true"
    mem_limit: 1536m
    cpus: 2.0
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    restart: unless-stopped

volumes:
  raise-postgres:
  raise-qdrant:
  raise-private-files:
  raise-model-cache:

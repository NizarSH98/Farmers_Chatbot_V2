# Production image-based Compose stack; only the web service is externally routed.
name: raise

x-api-image: &api-image
  image: ${API_IMAGE:-raise-api:local}
  pull_policy: always

x-api-environment: &api-environment
  APP_ENV: ${APP_ENV:-development}
  APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
  DATABASE_URL: postgresql://raise:${POSTGRES_PASSWORD:-raise-local-only}@postgres:5432/raise
  CLARIFICATION_DATABASE_URL: postgresql://raise:${POSTGRES_PASSWORD:-raise-local-only}@postgres:5432/raise
  LOCAL_FILE_ROOT: /app/data/private
  QDRANT_URL: http://qdrant:6333
  QDRANT_API_KEY: ${QDRANT_API_KEY:-raise-change-this-qdrant-key-now}
  PORT: "8000"
  FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:33198da2828a14c30348d2ccb4750833d5ed9a44c88d840a0e523d7417120337
    environment:
      POSTGRES_DB: raise
      POSTGRES_USER: raise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-raise-local-only}
    expose:
      - "5432"
    volumes:
      - raise-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raise -d raise"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - data

  qdrant:
    image: qdrant/qdrant:v1.17.1@sha256:94728574965d17c6485dd361aa3c0818b325b9016dac5ea6afec7b4b2700865f
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-raise-change-this-qdrant-key-now}
      QDRANT__TELEMETRY_DISABLED: true
    expose:
      - "6333"
    volumes:
      - raise-qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - data

  migrate:
    <<: *api-image
    command: ["python", "-m", "alembic", "upgrade", "head"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - data

  api:
    <<: *api-image
    env_file:
      - path: .env
        required: false
    environment:
      <<: *api-environment
    expose:
      - "8000"
    volumes:
      - raise-private-files:/app/data
      - raise-model-cache:/app/model-cache
    depends_on:
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    restart: unless-stopped
    networks:
      - edge
      - data

  web:
    image: ${WEB_IMAGE:-raise-web:local}
    pull_policy: always
    environment:
      API_INTERNAL_URL: http://api:8000
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    restart: unless-stopped
    networks:
      - edge

  bootstrap:
    <<: *api-image
    profiles: ["tools"]
    command: ["python", "-m", "scripts.build_graph_release", "--activate"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *api-environment
    volumes:
      - raise-model-cache:/app/model-cache
    depends_on:
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
    restart: "no"
    networks:
      - edge
      - data

  backup:
    image: ${BACKUP_IMAGE:-raise-backup:local}
    pull_policy: always
    profiles: ["backup"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: raise
      PGUSER: raise
      PGPASSWORD: ${POSTGRES_PASSWORD:-raise-local-only}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:-us-east-1}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-6}
      BACKUP_HOST: ${BACKUP_HOST:-raise-vps}
    volumes:
      - raise-private-files:/private-files:ro
      - raise-backup-work:/work
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-s", "/work/last-success"]
      interval: 5m
      timeout: 5s
      start_period: 10m
      retries: 3
    restart: unless-stopped
    networks:
      - edge
      - data

volumes:
  raise-postgres:
  raise-qdrant:
  raise-private-files:
  raise-model-cache:
  raise-backup-work:

networks:
  edge:
  data:
    internal: true

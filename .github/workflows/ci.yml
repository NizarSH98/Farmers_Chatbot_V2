name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python scripts/release_preflight.py
      - run: python -m compileall -q farmers_chatbot rag_chatbot.py mcp_server.py whatsapp_api.py
      - run: python -m ruff check farmers_chatbot tests scripts rag_chatbot.py mcp_server.py whatsapp_api.py
      - run: python -m pytest -q
      - run: python scripts/evaluate_retrieval.py
      - run: python scripts/benchmark_service.py --iterations 60 --workers 30

name: CI

# Validate Python/frontend/migrations/security, then build and publish SHA images.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Tests exercise the real schema; there is no second backend to fall
        # back to. pgvector matches the local Compose image.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: raise
          POSTGRES_USER: raise
          POSTGRES_PASSWORD: raise-local-only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U raise -d raise"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://raise:raise-local-only@127.0.0.1:55432/raise_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python scripts/release_preflight.py
      - run: python -m compileall -q farmers_chatbot mcp_server.py
      - run: python -m ruff check farmers_chatbot tests scripts mcp_server.py
      # English first as the inner loop, Arabic as a required gate. Both run in
      # CI; the split exists so local iteration need not pay for both.
      - run: python -m pytest -q -m "not arabic"
      - run: python -m pytest -q -m arabic

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate Alembic revision graph
        run: |
          python -m alembic heads
          DATABASE_URL=postgresql://user:pass@localhost/raise \
            python -m alembic upgrade head --sql > /tmp/raise-migration.sql
          python -c "from alembic.config import Config; from alembic.script import ScriptDirectory; from farmers_chatbot.migration_status import EXPECTED_DATABASE_REVISION; assert ScriptDirectory.from_config(Config('alembic.ini')).get_current_head() == EXPECTED_DATABASE_REVISION"
      - name: Validate SQL migration syntax
        run: |
          for f in migrations/*.sql; do
            echo "Checking $f ..."
            python3 -c "
          with open('$f') as fh:
              sql = fh.read()
          # Basic syntax checks: balanced parentheses, no trailing commas before )
          assert sql.count('(') == sql.count(')'), f'Unbalanced parentheses in $f'
          print(f'  $f OK ({len(sql)} chars)')
          "
          done

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pip-audit
      - run: pip-audit -r requirements.txt
      - run: pip-audit --disable-pip --no-deps -r requirements.lock.txt
      - run: docker compose -f compose.yaml config --quiet
      - name: Check for secrets in tracked files
        run: |
          if git grep -lP 'sk-or-v1[_-]|-----BEGIN (RSA |EC )?PRIVATE KEY-----|eyJhbGciOi[A-Za-z0-9]' -- ':!*.example' ':!*.md' ':!*.yml'; then
            echo "::error::Potential secret detected in tracked files"
            exit 1
          fi

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [python, frontend, migration, security]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Resolve lowercase GHCR image names
        id: images
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "api=ghcr.io/${repository}-api" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${repository}-web" >> "$GITHUB_OUTPUT"
          echo "backup=ghcr.io/${repository}-backup" >> "$GITHUB_OUTPUT"
      - name: Authenticate to GHCR
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API image metadata
        id: api-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.api }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Web image metadata
        id: web-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.web }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Backup image metadata
        id: backup-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.backup }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build and optionally publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build and optionally publish web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Build and optionally publish backup image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backup
          push: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          tags: ${{ steps.backup-meta.outputs.tags }}
          labels: ${{ steps.backup-meta.outputs.labels }}
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup
      - name: Notify Dokploy
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: |
          if [ -n "$DOKPLOY_DEPLOY_WEBHOOK" ]; then
            curl --fail --show-error --silent --request POST "$DOKPLOY_DEPLOY_WEBHOOK"
          else
            echo "DOKPLOY_DEPLOY_WEBHOOK is not configured; images were published without an automatic deployment."
          fi

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q farmers_chatbot rag_chatbot.py mcp_server.py whatsapp_api.py
      - run: python -m ruff check farmers_chatbot tests scripts rag_chatbot.py mcp_server.py whatsapp_api.py
      - run: python -m pytest -q
      - run: python scripts/evaluate_retrieval.py

services:
  - type: web
    name: raise-esdu-web-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn farmers_chatbot.web_api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: pilot
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ENABLE_TRUSTED_WEB_SEARCH
        value: "false"
      - key: LIVE_SOURCE_REGISTRY_PATH
        value: config/live_sources.v1.json
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WEB_AUTH_MODE
        value: supabase
      - key: WEB_ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: raise-private
      - key: APP_PUBLIC_URL
        sync: false
      - key: PRIVACY_CONTACT_EMAIL
        sync: false
      # Locked off until the canonical web app completes its seven-day soak.
      - key: WHATSAPP_ENABLED
        value: "false"
      # Vector cutover remains blocked until the bilingual embedding gate passes.
      - key: RAG_VECTOR_BENCHMARK_APPROVED
        value: "false"
      - key: RAG_EMBEDDING_BENCHMARK_REPORT
        value: ""
      - key: RAG_EMBEDDING_BENCHMARK_SHA256
        value: ""
